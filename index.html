<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>YouTube Secondary Viewer</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

#message {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    z-index: 10;
}

#message h1 {
    margin: 0;
    font-size: 24px;
}

#message p {
    margin: 0;
    max-width: 600px;
    line-height: 1.5;
    opacity: 0.8;
}

#openYoutube {
    padding: 10px 18px;
    border: 0;
    border-radius: 6px;
    background: #fff;
    color: #000;
    font-size: 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<iframe
    id="player"
    title="YouTube video"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture; web-share"
    allowfullscreen>
</iframe>

<div id="message">
    <h1>Unable to play this video here</h1>
    <p>
        YouTube did not allow the embedded player to load this video.
    </p>
    <button id="openYoutube">Open on YouTube</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("v");

const player = document.getElementById("player");
const message = document.getElementById("message");
const button = document.getElementById("openYoutube");

if (!id) {
    message.style.display = "flex";
} else {
    const youtubeUrl =
        "https://www.youtube.com/watch?v=" +
        encodeURIComponent(id);

    button.addEventListener("click", () => {
        window.location.href = youtubeUrl;
    });

    player.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1&controls=1&rel=0";
}
</script>

</body>
</html>
